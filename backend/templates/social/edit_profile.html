<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - SocialConnect</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        nav {
            background-color: #1877f2;
            color: white;
            padding: 15px 30px;
        }

        nav h2 {
            display: inline;
            margin-right: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .edit-container {
            max-width: 500px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
        }

        input[type="file"] {
            margin-top: 10px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0d65d9;
        }
    </style>
</head>

<body>

<nav>

    <h2>SocialConnect</h2>

    <a href="/social/">Home</a>

    <a href="/social/profile/{{ user.username }}/">
        My Profile
    </a>

    <a href="/social/logout/">
        Logout
    </a>

</nav>


<div class="edit-container">

    <h1>Edit Profile</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <label>Bio</label>

        <textarea
            name="bio"
            placeholder="Write something about yourself..."
        >{{ profile.bio }}</textarea>


        <label>Profile Image</label>

        <input
            type="file"
            name="profile_image"
            accept="image/*"
        >


        <button type="submit">
            Save Profile
        </button>

    </form>

</div>

</body>
</html>
